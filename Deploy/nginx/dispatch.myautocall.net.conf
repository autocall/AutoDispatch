# /etc/nginx/sites-available/dispatch.myautocall.net.conf → symlink в sites-enabled.
# SSL добавляет certbot: sudo certbot --nginx -d dispatch.myautocall.net (он дописывает listen 443 и редирект с 80).

# Лимит входа и сброса пароля с одного IP (аудит D10): 20 POST за 5 минут — 4 в минуту, первые 20 подряд без ожидания.
# nginx не видит результата входа — считаются все POST, удачные тоже. GET (страницы форм) не считается: пустой ключ.
# map и zone — в контексте http (файл подключается в http{} из nginx.conf); имена уникальны на хосте, там же AutoCall V3.
# Отказ — 429 с JSON { error }: App показывает его через ReadError, формы сайта — login_controller.
# Каждый отказ — в /var/log/nginx/error.log: «limiting requests, excess: … by zone "dispatch_login", client: IP».
map $request_method $dispatch_auth_ip {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $dispatch_auth_ip zone=dispatch_login:10m rate=4r/m;
limit_req_zone $dispatch_auth_ip zone=dispatch_forgot:10m rate=4r/m;

server {
    listen 80;
    server_name dispatch.myautocall.net;

    # документы dispatch (PDF, сканы) грузятся через App и setup packet; дефолт 1m не подойдёт — предел уточнить по V1 (AI/wiki/deploy.md)
    client_max_body_size 100m;

    # для всех location ниже
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location / {
        proxy_pass http://127.0.0.1:5005;
        # long-polling Api/Dispatch/Response (этап 4): таймаут должен быть больше ожидания EventNotificationAsync V1
        proxy_read_timeout 120s;
    }

    # вход: сайт (Account/LogIn) и App (Api/Account/SignIn) — один счётчик на IP. Без учёта регистра, как маршруты ASP.NET
    location ~* ^/(account/login|api/account/signin)/?$ {
        limit_req zone=dispatch_login burst=19 nodelay;
        limit_req_status 429;
        error_page 429 @dispatch_auth_limited;
        proxy_pass http://127.0.0.1:5005;
    }

    # письмо сброса пароля: сайт и App — свой счётчик на IP
    location ~* ^/(api/)?account/forgotpassword/?$ {
        limit_req zone=dispatch_forgot burst=19 nodelay;
        limit_req_status 429;
        error_page 429 @dispatch_auth_limited;
        proxy_pass http://127.0.0.1:5005;
    }

    location @dispatch_auth_limited {
        default_type application/json;
        return 429 '{"error":"Too many attempts. Try again in a few minutes."}';
    }
}
