# /etc/nginx/sites-available/dispatch.myautocall.net.conf → symlink в sites-enabled.
# SSL добавляет certbot: sudo certbot --nginx -d dispatch.myautocall.net (он дописывает listen 443 и редирект с 80).
server {
    listen 80;
    server_name dispatch.myautocall.net;

    # документы dispatch (PDF, сканы) грузятся через App и setup packet; дефолт 1m не подойдёт — предел уточнить по V1 (AI/wiki/deploy.md)
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # long-polling Api/Dispatch/Response (этап 4): таймаут должен быть больше ожидания EventNotificationAsync V1
        proxy_read_timeout 120s;
    }
}
